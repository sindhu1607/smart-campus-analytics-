[project]
name = "smart-campus-analytics"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<6.1",
    "djangorestframework>=3.15,<4",
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "python-dotenv>=1.0,<2",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
    "dj-database-url>=2.2,<3",
    "whitenoise>=6.7,<7",
    "gunicorn>=22,<24",
    "psycopg[binary]>=3.2,<4",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["**/migrations/**", ".venv", "venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F821"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
