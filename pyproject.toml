[project]
name = "smart-campus-analytics"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["**/migrations/**", ".venv", "venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F821"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
