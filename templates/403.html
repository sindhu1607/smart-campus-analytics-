{% extends 'base.html' %}

{% block title %}403 Access Denied - Smart Campus Analytics{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 text-danger fw-bold"><i class="bi bi-shield-lock"></i> 403</div>
    <h2 class="fw-bold mt-3">Access Restricted</h2>
    <p class="text-muted max-w-lg mx-auto">
        You do not have permission to view this page or resource. Server-side role isolation is actively enforced.
    </p>
    <a href="{% url 'accounts:dashboard_redirect' %}" class="btn btn-primary rounded-pill px-4 mt-3">
        <i class="bi bi-arrow-left"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
