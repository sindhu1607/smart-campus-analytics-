name: Django CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-not-for-deployment-0123456789abcdef
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: sqlite:///./ci.sqlite3
      TIME_ZONE: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m compileall -q apps config tests
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test tests apps.analytics
      - run: python manage.py collectstatic --noinput

  production-settings-check:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-production-check-secret-key-0123456789abcdef0123456789
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://localhost
      DATABASE_URL: sqlite:///./ci.sqlite3
      SECURE_SSL_REDIRECT: "True"
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SECURE: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py check --deploy
